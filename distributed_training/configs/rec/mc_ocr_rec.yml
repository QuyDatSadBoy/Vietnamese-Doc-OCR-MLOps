# distributed_training/configs/rec/mc_ocr_rec.yml
# Author : Trần Quý Đạt | tranquydat.work@gmail.com
# PP-OCRv4 recognition fine-tuning config for MC-OCR 2021 (Vietnamese)
# Ref: https://github.com/PaddlePaddle/PaddleOCR

Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_ppocr_v4
  save_epoch_step: 5
  eval_batch_step: [0, 2000]
  cal_metric_during_train: true

  # Vietnamese PP-OCRv4 pretrained weights
  pretrained_model: https://paddleocr.bj.bcebos.com/PP-OCRv4/vietnamese/rec_PPOCRv4_viet_mobile_train.tar
  checkpoints:
  save_inference_dir: ./output/rec_inference

  character_dict_path: ./distributed_training/configs/vi_dict.txt
  max_text_length: 25
  use_space_char: true
  infer_mode: false

  distributed: true

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Piecewise
    decay_epochs: [60, 80]
    values: [0.001, 0.0001, 0.00001]
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_channel: 256
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 64
    depth: 2
    hidden_dims: 120
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./Dataset/
    label_file_list:
      - ./Dataset/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./Dataset/
    label_file_list:
      - ./Dataset/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 4
