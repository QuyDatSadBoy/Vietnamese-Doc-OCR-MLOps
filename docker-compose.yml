# docker-compose.yml
# Author : Trần Quý Đạt | tranquydat.work@gmail.com
# Project: Vietnamese Document OCR Serving Model - MLOps Pipeline
#
# Starts: MLflow tracking server, distributed training service, Jenkins CI/CD

version: '3.8'

services:

  mlflow:
    container_name: mlflow
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
      - MLFLOW_ARTIFACT_ROOT=/mlflow

  train:
    container_name: vn-doc-ocr-train
    build:
      context: ./distributed_training
      dockerfile: Dockerfile
    volumes:
      - ./distributed_training:/app
      - ./model_repo:/app/model_repo
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000

  jenkins:
    image: fullstackdatascience/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mlflow-artifacts:
  jenkins_home:
